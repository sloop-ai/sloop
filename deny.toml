# cargo-deny configuration. Run with: cargo deny check
# CI runs `check advisories licenses bans sources`.

[advisories]
version = 2
# No blanket ignores. An advisory that genuinely does not apply gets its own
# entry here with a comment saying why, so the exception is reviewable.
ignore = [
  # `paste` is unmaintained, not vulnerable. It is a proc-macro pulled in
  # transitively by the lance/datafusion tree, so we cannot drop it without
  # dropping them. Revisit when those trees stop depending on it.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licenses only. Anything copyleft has to be a deliberate decision,
# so it fails the build rather than slipping in with a transitive bump.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
# Duplicate versions are noise at this size, not a defect: the lance and
# datafusion trees legitimately pull overlapping arrow versions.
multiple-versions = "warn"
wildcards = "deny"
# The crates in this workspace depend on each other by path and carry no
# version, which reads as a wildcard. That is how a workspace is meant to look.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
