[workspace]
members = [
  "crates/sloop-memory-core",
  "crates/sloop-harness",
  "crates/sloop-memory",
]
resolver = "2"

# Declared here so the version lives in one place. A bare `path` dependency
# carries no version, which reads as a wildcard and cannot be published.
[workspace.dependencies]
sloop-memory-core = { path = "crates/sloop-memory-core", version = "0.1.0" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No cheating
allow_attributes = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"
